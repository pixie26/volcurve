   /v1/instruments:
      get:
         tags:
         - cortex datahub
         summary: Returns the list of the available instruments
         description: "It returns the list of the instruments belonging to the data\
            \ sets for which the caller is entitled.\n\nThe result can be filtered\
            \ by the type of instrument.\n\nSeveral types can be passed as arguments\
            \ to the request.\n\nIf no 'type' parameter is passed, all the available\
            \ instruments are returned.\n\nexemples:\n\n\t# return all the available\
            \ instruments\n\t/v1/instruments\n\n\t# return only the 'equity' and 'swaption'\
            \ instruments\n\t/v1/instruments?type=equity&type=swaption\n\nThe result\
            \ can given in **json** or in **csv**. The 'Accept' header serves as a\
            \ selector of the return type.\nIf it is not provided, **json** is returned.\n\
            | Accept           | return type |\n| ---------------- | ------------|\n\
            |                  | json        |\n| application/json | json        |\n\
            | text/csv         | csv         |\n"
         operationId: getInstruments
         parameters:
         -  name: type
            in: query
            required: false
            schema:
               type: array
               items:
                  type: string
                  enum:
                  - equity
                  - swaption
                  - quantVault
                  - irs
                  - fxVol
                  - commoVol
                  - quantCredit
                  - fxVolSurface
                  - commoVolSurface
                  - rateVol
         responses:
            '200':
               description: Array of instruments
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: '#/components/schemas/Instrument'
                  text/csv: {
                     }
            '400':
               description: Bad Request
            '401':
               description: Unauthorized
            '403':
               description: the caller application cannot access the requested resource
            '405':
               description: Method Not Allowed
            '415':
               description: Unsupported Media Type
            '422':
               description: Unprocessable Entity
            '429':
               description: Too Many Requests
            '500':
               description: Internal Server Error
            '502':
               description: Bad Gateway
            '503':
               description: Service Unavailable
            '504':
               description: Gateay Time-out
            404:
               $ref: '#/components/responses/404'
