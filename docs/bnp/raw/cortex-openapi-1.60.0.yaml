   /v1/curves:
      post:
         tags:
         - cortex datahub
         summary: Returns a list of curves for a given range of maturities, over a
            period of time
         description: |3
                  Here are the different values for *maturityRule*.
            | Mode                                           | maturityRule field   | Optional fields                                       | Forbidden fields                           |
            | ----------------                               | ------------         | -----------------------------------                   | -----------------------------------        |
            | Sliding maturities                             | empty or **sliding** |  *lowMaturity* and *highMaturity*                     | *lowFixedMaturity* and *highFixedMaturity* |
            | Listed maturities, with theoritical maturities | **fixed**            |  *lowFixedMaturity* and *highFixedMaturity*           | *lowMaturity* and *highMaturity*           |
            | Listed maturities, no theoritical maturities   | **listed**           |  *lowFixedMaturity* and *highFixedMaturity*           | *lowMaturity* and *highMaturity*           |

            The result can given in **json** or in **csv**. The 'Accept' header serves as a selector of the return type.
            If it is not provided, **json** is returned.
            | Accept           | return type |
            | ---------------- | ------------|
            |                  | json        |
            | application/json | json        |
            | text/csv         | csv         |
         operationId: getCurves
         requestBody:
            content:
               application/json:
                  schema:
                     $ref: '#/components/schemas/CurvesRange'
            required: true
         responses:
            '200':
               description: Request curves
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: '#/components/schemas/curves'
                  text/csv: {
                     }
            '400':
               description: Bad Request
            '401':
               description: Unauthorized
            '403':
