openapi: 3.0.1
info:
   title: Cortex DataHub
   description: |
      <br>

      <h3>OVERVIEW</h3>
      <br>
      Cortex DataHub API allows external clients to access and discover the BNPP Global Markets Data Offer.
      <br><br>
      <h3>ENDPOINTS AVAILABLE</h3>
      When using any of the Cortex DataHub endpoints, the first step is to authenticate yourself on the gateway with this endpoint :
      <ul><li><b>POST  https://api.cib.bnpparibas.com/oauth2/v1/token</b> </li></ul>
      You will have to enter your clientId and clientSecret in the Authorization header. If your access is granted you will get a temporary token that will allow you to use all the API endpoints. The token will have to be filled in the Authorization header of each endpoint.
      <br>
      The following endpoints are available with your credentials : (details in the openapi file below)
      <ul><li><b>GET https://api.cib.bnpparibas.com/gm-cortex-datahub/v1/instruments</b>   :  Returns the list of all the equities with available historical data. Equities with implied-volatility. Swaptions. Quant Vault indicators</li></ul>
      <ul><li><b>POST https://api.cib.bnpparibas.com/gm-cortex-datahub/v1/implied-volatility</b>   :  Returns the implied-volatility surface for the specified instrument code (between your range of dates, strikes and maturities). The result can be either 'json' or 'csv'</li></ul>
      <ul><li><b>POST https://api.cib.bnpparibas.com/gm-cortex-datahub/v1/series</b>   :  Returns the series for the specified code (between your range of dates).
      The series can be either a Swaption or an Quant Vault indicator.
      The code name can be retreived from the result of a call to the 'instruments' endpoint listed above.
      The result can be either 'json' or 'csv'</li></ul>
      <br>Retrieve files<br>
      <ul><li><b>GET https://api.cib.bnpparibas.com/gm-cortex-datahub/v1/market-data/dates</b>   :   Returns the list of the available dates for the caller application</li></ul>
      <ul><li><b>GET https://api.cib.bnpparibas.com/gm-cortex-datahub/v1/market-data/dates/{date}/documents</b>   :   Returns the list of the available document names for the caller application for a date</li></ul>
      <ul><li><b>GET https://api.cib.bnpparibas.com/gm-cortex-datahub/v1/market-data/dates/{date}/documents/{name}</b>   :   Streams the content of a raw document</li></ul> <br>

      <h3>ONBOARDING PROCESS & TESTS</h3>
      Detailed information in the onboarding documentation see tab DOC
      <ul>
      <li>Get your consumer key and secret :
        <ul>
           <li>go to Apps button on the top of this web page</li>
           <li>click on the view button of the app created for you by our teams</li>
           <li>show consumer key and secret for your applications</li>
        </ul>
      </li>
      </ul>
      <ul>
      <li>3 ways to test :
        <ul>
           <li>try endpoints via the portal UI (sections below in this page) : calls are not available for this version </li>
           <li>try programatically : see tab DOC in the onboarding documentation, section test</li>
           <li>try via postman : see tab DOC in the onboarding documentation, section test</li>
        </ul>
      </li>
      </ul>
      <br>
      <h3>SUPPORT</h3>
      In case of technical questions (access, availability, etc.), please contact us at the following email address :
      <ul>
      <li>ecomeqd.production&#64;bnpparibas.com</li>
      </ul>
      Please be aware that you can also contact your representative sale :
      <ul>
      <li>dl.cortex.datahub.sales.team&#64;bnpparibas.com</li>
      </ul>
      <br>
