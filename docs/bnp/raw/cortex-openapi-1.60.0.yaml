components:
   schemas:
      SeriesRange:
         type: object
         properties:
            code:
               type: string
            startDate:
               type: string
               format: date
               pattern: yyyy-MM-dd
            endDate:
               type: string
               format: date
               pattern: yyyy-MM-dd
         required:
         - code
         - endDate
         - startDate
      Series:
         type: object
         properties:
            code:
               type: string
            ids:
               type: array
               items:
                  type: string
            values:
               type: array
               items:
                  type: number
                  format: double
         required:
         - code
         - ids
         - values
      RateVolatilityRange:
         type: object
         properties:
            code:
               type: string
            startDate:
               type: string
               format: date
               pattern: yyyy-MM-dd
            endDate:
               type: string
               format: date
               pattern: yyyy-MM-dd
            output:
               type: string
               description: "\t\tDefines the expected output mode\n\t\t| Mode    \
                  \          | description                                       \
                  \                         |\n\t\t| ----------------  | -------------------------------------------------------------------------\
                  \  |\n\t\t|  Volatility       | If volatility is present, its type\
                  \ will be included in the output response |\n\t\t|  Call       \
                  \      | \"call\" for call prices                              \
                  \                       |\n\t\t|  Put              | \"put\" for\
                  \ put prices                                                   \
                  \    |\n\t\t|  Straddle         | \"straddle\" for straddle prices\
                  \                                             |\n"
               enum:
               - Volatility
               - Call
               - Put
               - Straddle
            lowExpiry:
               type: string
               default: 1M
               enum:
               - 1M
               - 3M
               - 6M
               - 9M
               - 12M
               - 18M
               - 2Y
               - 3Y
               - 4Y
               - 5Y
               - 7Y
               - 10Y
               - 15Y
               - 20Y
               - 1P28D
               - 3P28D
               - 6P28D
               - 13P28D
               - 26P28D
               - 39P28D
               - 52P28D
               - 65P28D
            highExpiry:
               type: string
               default: 20Y
               enum:
               - 1M
               - 3M
               - 6M
               - 9M
               - 12M
               - 18M
               - 2Y
               - 3Y
               - 4Y
               - 5Y
               - 7Y
               - 10Y
               - 15Y
               - 20Y
               - 1P28D
               - 3P28D
               - 6P28D
               - 13P28D
               - 26P28D
               - 39P28D
               - 52P28D
               - 65P28D
            lowStrike:
               type: string
               description: low strike (optional). If not defined, provide the full
                  list of strikes available for the given rate.
               enum:
               - M200
               - M150
               - M100
               - M75
               - M50
               - M25
               - '0'
               - '25'
               - '50'
               - '75'
               - '100'
               - '150'
               - '200'
            highStrike:
               type: string
               description: high strike (optional). If not defined, provide the full
                  list of strikes available for the given rate.
               enum:
               - M200
               - M150
               - M100
               - M75
               - M50
               - M25
               - '0'
               - '25'
               - '50'
               - '75'
               - '100'
               - '150'
               - '200'
         required:
         - code
         - endDate
         - output
         - startDate
      VolatilityRange:
         type: object
         properties:
            code:
               type: string
            codeType:
               type: string
               default: bnpp
               enum:
               - bnpp
               - bbg
               - isin
               - ric
               - sedol
            maturityRule:
               type: string
               description: |
                  This field is optional. If it is not set, the default value depends on the value of **strikeRule**.
                  When 'strikeRule' is 'fixed', the default value is 'fixed'.
