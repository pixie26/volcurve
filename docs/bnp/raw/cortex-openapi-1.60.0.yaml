      Volatility:
         type: object
         properties:
            date:
               type: string
               format: date
               pattern: yyyy-MM-dd
            time:
               type: string
               description: computation time. This field is optional and is present
                  for intraday data.
               pattern: HH:mm
            timeZone:
               type: string
            code:
               type: string
            maturityRule:
               type: string
               enum:
               - sliding
               - fixed
               - listed
            strikeRule:
               type: string
               enum:
               - relative_to_forward
               - relative_to_spot_ref
               - fixed
               - delta
            volatilityConvention:
               type: string
               description: volatility convention. Usualy, only 'bsVol' is available.
                  'bnppVol' is only available for the volatility on dividends.
               enum:
               - bsVol
               - bnppVol
            spot:
               type: number
               format: float
               description: reference spot. It may be empty for the historical data.
            maturities:
               type: array
               description: maturity list of the surface. Each maturity can be either
                  under the form of a sliding maturity (12M, 24M etc.) in the case
                  where 'strikeRule' is 'relative_to_forward' or 'relative_to_spot_ref',
                  or under the form of a date yyyy-MM-dd in the case where 'strikeRule'
                  is 'fixed'.
               items:
                  type: string
            strikes:
               type: array
               description: strike list of the surface
               items:
                  type: string
            forwardCurve:
               type: array
               description: forward curve. One value per maturity.
               items:
                  type: number
                  format: float
            zcCurve:
               type: array
               description: zero-coupon curve. One value per maturity.
               items:
                  type: number
                  format: float
            matrix:
               type: array
               description: volatility values in a matrix. The matrix is oriented
                  per maturities/strikes (maturities in row, and strikes in column).
                  The field 'matrix' is only defined when the requested layout was
                  'matrix', otherwise it is empty.
               items:
                  type: array
                  items:
                     type: number
                     format: float
            vector:
               type: array
               description: volatility values in a flat vector. The vector represents
                  the matrix of the volatility values. That matrix is oriented per
                  maturities/strikes (maturities in row, and strikes in column). The
                  field 'vector' is only defined when the requested layout was 'vector',
                  otherwise it is empty.
               items:
                  type: number
                  format: float
         required:
         - code
         - date
         - forwardCurve
         - maturities
         - maturityRule
         - strikeRule
         - strikes
         - volatilityConvention
      FxVolatilityRange:
         type: object
         properties:
            code:
               type: string
            startDate:
               type: string
               format: date
               pattern: yyyy-MM-dd
            endDate:
               type: string
               format: date
               pattern: yyyy-MM-dd
            output:
               type: string
               description: "\t\tDefines the expected output mode\n\t\t| Mode    \
                  \            | description                                     |\
                  \ possible strikes                            |\n\t\t| ----------------\
                  \    | ------------                                    |  ------------\
                  \                               |\n\t\t| Put_Call_Vol        | for\
                  \ implied vol in delta                        | \"PUT10\", \"PUT25\"\
                  , \"ATM\", \"CALL10\", \"CALL25\" |\n\t\t| RR_BF_Vol           |\
                  \ for implied vol in risk reversal and butterfly  | \"ATM\", \"\
                  RR25\", \"RR10\", \"BF25\", \"BF10\"       |\n\n"
               enum:
               - Put_Call_Vol
               - RR_BF_Vol
            close:
               type: string
               enum:
               - EMEA
               - APAC
               - AMER
            strikes:
               type: array
               description: |
                  Not mandatory. If not defined, the full list of strikes related to the 'output' value is used.
                  Otherwise, the user can define the list of strikes he/she wants (has to be compatible with the type of output: "Put_Call_Vol" vs "RR_BF_Vol")
               items:
                  type: string
                  enum:
