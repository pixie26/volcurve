   /v1/implied-volatility:
      post:
         tags:
         - cortex datahub
         summary: Returns the volatility surfaces for a given range of strikes and
            maturities, over a period of time
         description: |
            Here are the different combinations for *maturityRule* and *strikeRule*.
            | Mode                                                               | maturityRule field    | strikeRule field                                     |  Mandatory Fields                                           | Optional Fields                                                                 | Forbidden Fields                                                                                           |
            | ----------------                                                   | ------------          |  ------------                                        |-----------------------------------                          | ------------                                                                    | ------------                                                                                               |
            | Sliding maturities and strikes                                     | empty or **sliding**  | **relative_to_forward** or **relative_to_spot_ref**  | *lowStrike*, *highStrike*, *lowMaturity* and *highMaturity* |                                                                                 | *lowFixedStrike*, *highFixedStrike*, *lowFixedMaturity* and *highFixedMaturity*                            |
            | Listed maturities and fixed strikes                                | empty or **fixed**    | **fixed**                                            |                                                             | *lowFixedStrike*, *highFixedStrike*, *lowFixedMaturity* and *highFixedMaturity* | *lowStrike*, *highStrike*, *lowMaturity* and *highMaturity*                                                |
            | Listed maturities and fixed strikes (same as above)                | **listed**            | **fixed**                                            |                                                             | *lowFixedStrike*, *highFixedStrike*, *lowFixedMaturity* and *highFixedMaturity* | *lowStrike*, *highStrike*, *lowMaturity* and *highMaturity*                                                |
            | Listed maturities and sliding strikes, with theoritical maturities | **fixed**             | **relative_to_forward** or **relative_to_spot_ref**  | *lowStrike*, *highStrike*                                   | *lowFixedMaturity* and *highFixedMaturity* can be set                           | *lowFixedStrike*, *highFixedStrike*, *lowMaturity* and *highMaturity*                                      |
            | Listed maturities and sliding strikes, no theoritical maturities   | **listed**            | **relative_to_forward** or **relative_to_spot_ref**  | *lowStrike*, *highStrike*                                   | *lowFixedMaturity* and *highFixedMaturity* can be set                           | *lowFixedStrike*, *highFixedStrike*, *lowMaturity* and *highMaturity*                                      |
            | Volatility in delta                                                | empty or **sliding**  | **delta**                                            |                                                             | *lowDeltaStrike*, *highDeltaStrike*, *lowMaturity* and *highMaturity*           | *lowStrike*, *highStrike*, *lowFixedStrike*, *highFixedStrike*, *lowFixedMaturity* and *highFixedMaturity* |

            The result can given in **json** or in **csv**. The 'Accept' header serves as a selector of the return type.
            If it is not provided, **json** is returned.
            | Accept           | return type |
            | ---------------- | ------------|
            |                  | json        |
            | application/json | json        |
            | text/csv         | csv         |
         operationId: getVolatilityStream
         requestBody:
            content:
               application/json:
                  schema:
                     $ref: '#/components/schemas/VolatilityRange'
            required: true
         responses:
            '200':
               description: Request volatility surfaces
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: '#/components/schemas/Volatility'
                  text/csv: {
                     }
            '400':
               description: Bad Request
            '401':
               description: Unauthorized
            '403':
               description: the caller application cannot access the requested resource
            '404':
               description: Not Found
            '405':
               description: Method Not Allowed
            '415':
               description: Unsupported Media Type
            '422':
               description: Unprocessable Entity
            '429':
               description: Too Many Requests
            '500':
               description: Internal Server Error
            '502':
               description: Bad Gateway
            '503':
               description: Service Unavailable
            '504':
               description: Gateay Time-out
