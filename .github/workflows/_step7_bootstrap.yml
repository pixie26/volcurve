name: Step 7 bootstrap and deep tests

on:
  push:
    branches:
      - feat/step7-historical-archive

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/step7-historical-archive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply Step 7
        run: python scripts/_apply_step7.py

      - name: Remove bootstrap files
        run: |
          rm scripts/_apply_step7.py
          rm .github/workflows/_step7_bootstrap.yml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile Python
        run: python -m compileall -q app tests

      - name: Ruff
        run: python -m ruff check .

      - name: Deep targeted tests
        run: python -m pytest -q tests/unit/test_historical_archive.py tests/unit/test_storage_and_cache.py tests/integration/test_phase_d_web.py

      - name: Full tests
        run: python -m pytest -q

      - name: Diff check
        run: git diff --check

      - name: Commit tested implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add revision-aware historical volatility archive"
          git push origin HEAD:feat/step7-historical-archive
