name: Step 6.1 patch bootstrap

on:
  push:
    branches:
      - fix/step6-1-restore-bulk-fixed

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/step6-1-restore-bulk-fixed
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply Step 6.1
        run: python scripts/_apply_step6_1.py
      - name: Remove bootstrap files
        run: |
          rm scripts/_apply_step6_1.py
          rm .github/workflows/_step6_1_patch.yml
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore bulk Fixed maturity as exact request"
          git push origin HEAD:fix/step6-1-restore-bulk-fixed
