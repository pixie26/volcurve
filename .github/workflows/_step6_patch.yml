name: Step 6 patch bootstrap

on:
  push:
    branches:
      - cleanup/step6-bulk-maturity-logging

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: cleanup/step6-bulk-maturity-logging
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply Step 6
        run: python scripts/_apply_step6.py
      - name: Remove bootstrap files
        run: |
          rm scripts/_apply_step6.py
          rm .github/workflows/_step6_patch.yml
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clean up bulk maturity UI and upstream logging"
          git push origin HEAD:cleanup/step6-bulk-maturity-logging
